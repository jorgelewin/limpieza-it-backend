spring.application.name=limpiezaIT

# Configuraci?n de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/limpieza_it_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci?n de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuraci?n adicional
spring.jpa.open-in-view=false

# Configuraci?n del pool de conexiones HikariCP (opcional)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Configuraci?n de logs para reducir mensajes informativos
logging.level.org.hibernate=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.com.zaxxer.hikari=WARN
logging.level.org.springframework.orm.jpa=WARN



